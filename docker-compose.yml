services:
  mongo:
    image: mongo:7
    container_name: attendance-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  face-service:
    build: ./face-service
    container_name: attendance-face-service
    restart: unless-stopped
    ports:
      - "8001:8000"

  backend:
    build: ./backend
    container_name: attendance-backend
    restart: unless-stopped
    depends_on:
      - mongo
      - face-service
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      TZ: ${TZ:-Asia/Kolkata}
      MONGO_URI: mongodb://mongo:27017/attendance_system
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_secret}
      JWT_EXPIRES_IN: 8h
      FACE_SERVICE_URL: http://face-service:8000
      FACE_MATCH_THRESHOLD: 0.80
      UPLOAD_MAX_SIZE_MB: 5
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}
      TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Attendai <no-reply@attendai.app>}
      EMPLOYEE_2FA_REQUIRED: ${EMPLOYEE_2FA_REQUIRED:-true}
      REPORTING_API_KEY: ${REPORTING_API_KEY:-}
      REPORTING_WRITE_KEY: ${REPORTING_WRITE_KEY:-}
      POWERBI_PUSH_URL: ${POWERBI_PUSH_URL:-}
      WAREHOUSE_SYNC_HOUR: ${WAREHOUSE_SYNC_HOUR:-2}

  admin-dashboard:
    build:
      context: ./admin-dashboard
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: attendance-admin-dashboard
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo_data: